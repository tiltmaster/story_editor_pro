name: Native quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --debug --no-pub
        working-directory: example

  ios:
    # MediaPipeTasksVision 0.10.35 is built with the iOS 26 SDK and
    # auto-links CoreAudioTypes, which is unavailable in Xcode 16's SDK.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter pub get
        working-directory: example
      - name: Compile the iOS pod
        working-directory: ios
        run: >-
          pod lib lint story_editor_pro.podspec
          --allow-warnings
          --skip-import-validation
          --skip-tests
          --use-static-frameworks
      - run: flutter build ios --simulator --debug --no-codesign
        working-directory: example
      - name: Run iOS simulator tests
        working-directory: example/ios
        run: >-
          xcodebuild
          -workspace Runner.xcworkspace
          -scheme Runner
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          CODE_SIGNING_ALLOWED=NO
          test
