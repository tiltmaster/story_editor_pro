name: Native quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --debug --no-pub
        working-directory: example

  ios:
    # MediaPipeTasksVision 0.10.35 is built with the iOS 26 SDK and
    # auto-links CoreAudioTypes, which is unavailable in Xcode 16's SDK.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter pub get
        working-directory: example
      - name: Compile the iOS pod
        working-directory: ios
        run: >-
          pod lib lint story_editor_pro.podspec
          --allow-warnings
          --skip-import-validation
          --skip-tests
          --use-static-frameworks
      - run: flutter build ios --simulator --debug --no-codesign
        working-directory: example
      - name: Run iOS simulator tests
        working-directory: example/ios
        run: |
          set +e
          result_bundle="$RUNNER_TEMP/RunnerTests.xcresult"
          diagnostic_log="$RUNNER_TEMP/RunnerTests-diagnostics.log"

          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath "$result_bundle" \
            CODE_SIGNING_ALLOWED=NO \
            test
          test_status=$?

          if [ "$test_status" -ne 0 ]; then
            {
              echo "=== XCTest result summary ==="
              xcrun xcresulttool get test-results summary \
                --path "$result_bundle" 2>&1 || true
              echo "=== Booted simulator devices ==="
              xcrun simctl list devices booted 2>&1 || true
              echo "=== Runner and XCTest simulator log ==="
              xcrun simctl spawn booted log show \
                --last 15m \
                --style compact \
                --predicate 'process == "Runner" OR process == "RunnerTests" OR eventMessage CONTAINS[c] "Runner" OR eventMessage CONTAINS[c] "XCTest"' \
                2>&1 || true
            } | tee "$diagnostic_log"
          fi

          exit "$test_status"
      - name: Upload iOS test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics
          path: |
            ${{ runner.temp }}/RunnerTests.xcresult
            ${{ runner.temp }}/RunnerTests-diagnostics.log
          if-no-files-found: warn
          retention-days: 7
